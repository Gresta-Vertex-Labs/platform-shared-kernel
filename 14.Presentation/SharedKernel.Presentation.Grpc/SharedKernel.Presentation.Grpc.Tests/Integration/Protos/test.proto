syntax = "proto3";

option csharp_namespace = "SharedKernel.Presentation.Grpc.Tests.Integration";

package grpctest;

// Test-only service for this package's in-process host tests. Not a production contract.
service TestService {
  rpc Echo (EchoRequest) returns (EchoReply);
  // Fails in the way request.value names; see TestServiceImpl.Failures.
  rpc Fail (EchoRequest) returns (EchoReply);
  // Writes one message, then fails in the way request.value names.
  rpc StreamFail (EchoRequest) returns (stream EchoReply);
  // Waits until the call is cancelled.
  rpc WaitForCancellation (EchoRequest) returns (EchoReply);
  // Reports the correlation id the service sees.
  rpc GetContext (EchoRequest) returns (ContextReply);
  // [RequirePermission("orders.read")]
  rpc ReadOrders (EchoRequest) returns (EchoReply);
  // [RequireFreshAuthentication(60)]
  rpc ApproveOrder (EchoRequest) returns (EchoReply);
}

message EchoRequest {
  string value = 1;
}

message EchoReply {
  string value = 1;
}

message ContextReply {
  string correlation_id = 1;
  string baggage_correlation_id = 2;
}
