syntax = "proto3";

option csharp_namespace = "SharedKernel.Communication.Grpc.Tests.Probe";

package sharedkernel.communication.tests;

// A test service that reports what each call carried and fails on request.
service Probe {
  rpc Echo (EchoRequest) returns (EchoReply);
}

message EchoRequest {
  string text = 1;
  // How many attempts fail with Unavailable before one succeeds.
  int32 fail_attempts = 2;
}

message EchoReply {
  string text = 1;
  map<string, string> metadata = 2;
  // Seconds from the server's receipt to the call's deadline; 0 when none.
  double deadline_seconds = 3;
  int32 attempt = 4;
}
