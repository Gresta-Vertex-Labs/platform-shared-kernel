name: Release

# The release train (WO-086 / P-572). Pushing one `v*` tag publishes EVERY package in this
# repository to GitHub Packages at that one version, after the full set of gates has passed. There
# is no other way to publish: publish-package.yml is a dry run only, and no per-package or
# "republish closure" procedure exists any more.
#
#   tag-guard  the tag is well formed and points at a commit on main
#   verify     .github/workflows/verify.yml with everything on: tier check, solution-filter check,
#              full build, the Unit suite and every consumer-verify harness, the Integration suite
#              (Testcontainers), and packaging-verify, which packs every package, checks the set
#              (eng/verify-packages.sh: complete, one version, equal to the tag), then restores,
#              builds, tests and smoke-runs every packed-package consumer and sample against it.
#              The verified .nupkg files are uploaded as the "packages" artifact.
#   publish    downloads exactly those files, re-checks the set against the expected-package list
#              the verified run produced (so a partial download can never be published), and pushes.
#   skill      packs the consumer skill at the verified version (eng/pack-consumer-skill.sh) and
#              attaches sharedkernel-skill-v<version>.zip to the GitHub Release for the tag.
#
# The expected set is derived from the repository, not kept by hand: eng/PackageInventory.proj asks
# every csproj on disk whether it packs (its evaluated IsPackable/PackageId). A packable project
# that fell out of the solution, a pack that silently skipped a project, or a stale extra file all
# fail the run before anything is pushed.
#
# Versioning: MinVer (Directory.Build.props) stamps every package from the tag; fetch-depth: 0 is
# mandatory wherever dotnet runs (verify.yml). This workflow never creates a tag. Cutting one is the
# user's own, explicit decision (see CONTRIBUTING.md "Versioning and releases").
#
# Why GitHub Packages, not nuget.org: it needs no new secret (the ambient GITHUB_TOKEN with
# packages: write), no external account and no public-registry commitment. nuget.org via Trusted
# Publishing is not implemented; it would be one more push step in the publish job.
#
# Gating that is authored but NOT active until a repository admin acts (see eng/README.md, "CI workflows"):
#   1. `environment: nuget-publish` needs a GitHub Environment of that name with required
#      reviewers. Until it exists the publish job runs unattended once verify passes.
#   2. .github/rulesets/tag-protection.json (only admins may create/update/delete v* tags) is not
#      imported yet, so anyone with push access can start a release by pushing a tag.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions: {}

# One release per tag at a time, and never cancelled mid-flight: a cancelled push can leave part
# of the package set published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-guard:
    name: Tag is well formed and on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # SemVer 2.0 (MinVer's own grammar), and only commits already reviewed into main are
      # released: a tag on a feature branch would publish code no pull request approved.
      - name: Check the tag
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! printf '%s' "$tag" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::Tag '$tag' is not v<major>.<minor>.<patch>[-prerelease]."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$tag' points at $GITHUB_SHA, which is not on main. Release only from main."
            exit 1
          fi
          echo "OK: $tag ($GITHUB_SHA) is well formed and on main."

  verify:
    name: Verify
    needs: [tag-guard]
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
    with:
      unit: true
      integration: true
      packaging: true
      upload-packages: true
      expected-version: ${{ github.ref_name }}

  publish:
    name: Publish every package
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nuget-publish
    permissions:
      contents: read
      packages: write
    env:
      DOTNET_CLI_UI_LANGUAGE: en
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # global.json pins the SDK band, and dotnet refuses to run inside the repo without it.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download the verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: release-packages

      # Same check packaging-verify ran, against the downloaded files and the expected list that
      # run derived: the complete set, one version, equal to the tag. The script exports SK_VERSION
      # through $GITHUB_ENV, which reaches later steps only, so the comparison is a step of its own.
      - name: Re-verify the package set
        env:
          EXPECTED_PACKAGES_FILE: release-packages/expected-packages.txt
        run: bash eng/verify-packages.sh release-packages "$GITHUB_REF_NAME"

      - name: Downloaded version equals the verified version
        env:
          VERIFIED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$SK_VERSION" != "$VERIFIED_VERSION" ]; then
            echo "::error::Downloaded packages are $SK_VERSION but verify packed $VERIFIED_VERSION."
            exit 1
          fi

      # Only *.nupkg: GitHub Packages has no symbol-server endpoint and rejects a .snupkg push.
      # --skip-duplicate makes a re-run of a partly failed publish idempotent.
      - name: Push to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: |
          set -euo pipefail
          dotnet nuget push "release-packages/*.nupkg" \
            --source "$FEED_URL" \
            --api-key "$NUGET_AUTH_TOKEN" \
            --skip-duplicate

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Release ${GITHUB_REF_NAME}"
            echo ""
            if [ -f release-packages/expected-packages.txt ]; then
              echo "$(grep -c . release-packages/expected-packages.txt) packages at \`${SK_VERSION:-<not verified>}\`:"
              echo ""
              sed 's/^/- /' release-packages/expected-packages.txt
            else
              echo "The verified package set was not downloaded; nothing was pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The consumer skill (consumer/README.md, "How it ships") at the same version as the packages, from
  # the same commit, attached to the GitHub Release for the tag. It runs only after every package is
  # on the feed, so a release never advertises guidance for packages that are not there. The asset
  # name, the archive layout (sharedkernel/ at the root) and the stamped version are the contract
  # consuming services sync against. contents: write is needed on this job only, to create the
  # release and upload the asset.
  skill:
    name: Attach the consumer skill
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pack the skill
        id: pack
        env:
          SK_VERSION: ${{ needs.verify.outputs.version }}
        run: bash eng/pack-consumer-skill.sh "$SK_VERSION" release-skill

      # A pre-release tag (-rc.N) ships a pre-release skill. Re-running the job replaces the asset
      # on the existing release instead of failing.
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ steps.pack.outputs.asset }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            prerelease=()
            case "$tag" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$tag" "$ASSET" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${prerelease[@]}"
          fi

      - name: Job summary
        if: always()
        env:
          ASSET: ${{ steps.pack.outputs.asset }}
        run: |
          {
            echo "## Consumer skill"
            echo ""
            if [ -n "${ASSET:-}" ]; then
              echo "- \`$(basename "$ASSET")\` attached to release \`${GITHUB_REF_NAME}\`"
            else
              echo "The skill was not packed; nothing was attached."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
