name: Package Dry Run

# Manual, on-demand DRY RUN for ONE package: restore, build, run its nested test project, pack, and
# check its dependencies against GitHub Packages. It never publishes anything.
#
# Publishing happens only through the release train (release.yml): one `v*` tag packs and publishes
# every package at one version after the full CI gate set has passed (WO-086 / P-572). The earlier
# single-package publish path, and the "publish each dependency first, in dependency order"
# republish procedure it required, were removed with it. MinVer derives a prerelease version from
# commit height, so a package published on its own declares its SharedKernel.* dependencies at the
# height of THAT build, not at the height they were published at, and every publish of a package
# with dependencies meant republishing its whole dependency closure first. The release train makes
# that problem impossible instead of managing it.
#
# What a dry run is still good for:
#   - proving one package restores, builds, tests and packs on a clean runner, from a branch, with
#     no tag;
#   - reading its packed .nuspec (the job log prints every declared dependency);
#   - the dependency gate: whether every SharedKernel.* dependency it declares already resolves from
#     GitHub Packages. On a branch this normally fails (NU1102: the feed has the last release, the
#     branch packs a newer height), which is expected and exactly why packages are released together.
#   - for SharedKernel.Analyzers/.ArchitectureTests/.Linter, their packed-artifact harness.
#
# Standing hygiene identical to ci.yml/release.yml: permissions: {} at the root widened per job,
# every action pinned to a full 40-character SHA, fetch-depth: 0 (MinVer needs the tag history),
# persist-credentials: false, timeout-minutes set. packages: read only, for the dependency gate.

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Path to the .csproj to dry-run (restore, build, test, pack, dependency gate). Nothing is published; releases go through release.yml.'
        type: string
        default: '00.Governance/SharedKernel.ArchitectureTests/SharedKernel.ArchitectureTests.csproj'
      version:
        description: 'Optional exact version to stamp (e.g. 1.2.3). Empty = MinVer-derived version.'
        type: string
        default: ''

permissions: {}

jobs:
  dry-run:
    name: Pack & dependency gate (dry run, single package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      DOTNET_CLI_UI_LANGUAGE: en
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
      # Inputs are copied into env once rather than interpolated with ${{ }} into run: blocks: a
      # workflow_dispatch input is caller-supplied text, and splicing it into a shell script is a
      # script-injection surface even for a repo-internal manual trigger.
      INPUT_PROJECT: ${{ inputs.project }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # MinVer needs full tag history even on the default (no version override) path — see
          # ci.yml/release.yml's identical comment. A shallow clone would silently stamp the
          # MinVerMinimumMajorMinor floor instead of the real height-derived prerelease.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Fail fast and loud rather than packing something that was deliberately marked non-packable,
      # or a project path that does not exist (a typo'd workflow_dispatch input).
      - name: Validate inputs
        run: |
          set -e
          if [ ! -f "$INPUT_PROJECT" ]; then
            echo "::error::project '$INPUT_PROJECT' does not exist on disk."
            exit 1
          fi

          is_packable=$(dotnet msbuild "$INPUT_PROJECT" -getProperty:IsPackable -nologo)
          if [ "$is_packable" != "true" ]; then
            echo "::error::'$INPUT_PROJECT' has IsPackable=$is_packable. Refusing to pack a project that is not marked packable."
            exit 1
          fi
          echo "OK: $INPUT_PROJECT is packable."

          if [ -n "$INPUT_VERSION" ]; then
            if ! echo "$INPUT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::version '$INPUT_VERSION' does not match ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\$."
              exit 1
            fi
            echo "MINVER_OVERRIDE_ARGS=-p:MinVerVersionOverride=$INPUT_VERSION" >> "$GITHUB_ENV"
            echo "OK: version override '$INPUT_VERSION' is well-formed."
          else
            echo "MINVER_OVERRIDE_ARGS=" >> "$GITHUB_ENV"
            echo "No version override supplied — using the MinVer-derived version."
          fi

      - name: Restore
        run: dotnet restore "$INPUT_PROJECT"

      - name: Build (Release)
        # MINVER_OVERRIDE_ARGS is intentionally unquoted: it is either empty or a single
        # "-p:MinVerVersionOverride=X.Y.Z" token, and word-splitting an empty string into zero
        # arguments (rather than one empty-string argument) is exactly the wanted behavior here.
        run: |
          # shellcheck disable=SC2086
          dotnet build "$INPUT_PROJECT" --no-restore --configuration Release $MINVER_OVERRIDE_ARGS

      # Convention (root CLAUDE.md "Test Project Rules"): a package's test project is nested
      # inside its own folder as "{PackageName}.Tests". For the default input that resolves to
      # 00.Governance/SharedKernel.Analyzers/SharedKernel.Analyzers.Tests/SharedKernel.Analyzers.Tests.csproj
      # (272 tests, confirmed by running it locally against this exact project during the pass
      # that authored this workflow). Not every packable project necessarily has one nested next
      # to it under this exact convention, so absence is a log line, not a failure.
      - name: Locate nested test project
        run: |
          set -e
          project_dir=$(dirname "$INPUT_PROJECT")
          project_name=$(basename "$INPUT_PROJECT" .csproj)
          test_project="$project_dir/$project_name.Tests/$project_name.Tests.csproj"
          if [ -f "$test_project" ]; then
            echo "TEST_PROJECT=$test_project" >> "$GITHUB_ENV"
            echo "Found nested test project: $test_project"
          else
            echo "TEST_PROJECT=" >> "$GITHUB_ENV"
            echo "No nested test project at $test_project — nothing to run for this project."
          fi

      # A failing suite here fails the job outright (no continue-on-error) — every step after this
      # one, including Pack, never runs.
      - name: Run nested test project (fails the dry run on failure)
        if: env.TEST_PROJECT != ''
        run: dotnet test "$TEST_PROJECT" --configuration Release

      - name: Pack
        # See the Build step's identical comment: MINVER_OVERRIDE_ARGS is deliberately unquoted.
        run: |
          # shellcheck disable=SC2086
          dotnet pack "$INPUT_PROJECT" --no-restore --configuration Release $MINVER_OVERRIDE_ARGS

      # Only *.nupkg is ever pushed (see the Push step below) — GitHub Packages' NuGet registry
      # rejects a .snupkg push outright, same fact release.yml's own comment already records.
      # "*.nupkg" as a shell glob does not match "*.snupkg" (its own last 6 characters are
      # "snupkg", not ".nupkg"), so this count is already symbol-package-clean.
      - name: Assert exactly one package was produced
        run: |
          set -e
          count=$(find nupkgs -maxdepth 1 -name "*.nupkg" | wc -l)
          echo "Found $count .nupkg file(s) in nupkgs/:"
          find nupkgs -maxdepth 1 -name "*.nupkg" -exec basename {} \; || true
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 .nupkg, found $count. A single-package dry run must produce exactly one artifact."
            exit 1
          fi

          nupkg_path=$(find nupkgs -maxdepth 1 -name "*.nupkg")
          nupkg_basename=$(basename "$nupkg_path" .nupkg)
          # Anchored at end-of-name, identical to ci.yml/release.yml's own version-extraction
          # pattern, so a package ID that itself ends in a digit (e.g. SharedKernel.Storage.S3)
          # can never have part of its own name misread as the version.
          packed_version=$(echo "$nupkg_basename" | grep -oE '[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$')
          package_id=${nupkg_basename%".$packed_version"}

          {
            echo "NUPKG_PATH=$nupkg_path"
            echo "PACKAGE_ID=$package_id"
            echo "PACKED_VERSION=$packed_version"
          } >> "$GITHUB_ENV"
          echo "Packed: $package_id @ $packed_version"

      # The dependency gate: would this package restore for a consumer if it were the only one
      # published? Each SharedKernel.* dependency in the packed .nuspec must already be on the feed
      # at a version satisfying the declared range.
      #
      # WHY IT USUALLY FAILS ON A BRANCH. MinVer derives the version from commit HEIGHT, so every
      # pack stamps its SharedKernel.* dependencies at the height of THIS build. The feed holds the
      # last release, so a branch build of a package with dependencies declares versions that were
      # never pushed (NU1102). That is the hazard the release train (release.yml) exists to remove:
      # all packages are published together at one version, so their dependency versions always
      # exist. A pass here means the package has no SharedKernel.* dependencies, or its
      # dependencies are unchanged since a published version that satisfies the range.
      #
      # HOW IT CHECKS. By running a real `dotnet restore` against a throwaway project that
      # PackageReferences each SharedKernel.* dependency at exactly the version the packed .nuspec
      # declares. NuGet's own resolver answers the question, rather than this workflow
      # re-implementing feed-protocol and version-range semantics and getting an edge case wrong.
      # The .nuspec is the authoritative input because it is the file a consumer's restore reads.
      #
      # THE VERSIONS ARE DELIBERATELY NOT PINNED WITH [brackets]. A .nuspec dependency version is a
      # MINIMUM, not an equality, so a bare Version="X" reproduces consumer semantics exactly. An
      # exact pin would fail a dependency that actually resolves: if .891 was packed but only .895 ever
      # reached the feed, every consumer resolves .895 and works, while `[.891]` would refuse.
      - name: Assert every SharedKernel.* dependency already exists on the feed
        env:
          FEED_OWNER: ${{ github.repository_owner }}
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          work="$RUNNER_TEMP/dependency-gate"
          extracted="$work/extracted"
          deps="$work/sharedkernel-deps.tsv"
          probe="$work/probe"

          # rm -rf before extracting, and a per-run directory rather than a fixed /tmp path, both
          # matter. The previous version of this step unzipped into a /tmp directory it never
          # cleaned and then took `find ... -name '*.nuspec' | head -1`, which silently reads an
          # ARBITRARY nuspec as soon as that directory holds more than one — so the gate could
          # validate the dependency set of a package other than the one being published, and
          # report a pass for it. A fresh runner hides this (its /tmp is empty), but it made the
          # step order-dependent and impossible to exercise locally; caught by doing exactly that.
          rm -rf "$work"
          mkdir -p "$extracted" "$probe"

          unzip -o -q "$NUPKG_PATH" -d "$extracted"
          nuspec_count=$(find "$extracted" -maxdepth 1 -name '*.nuspec' | wc -l)
          if [ "$nuspec_count" -ne 1 ]; then
            echo "::error::Expected exactly 1 .nuspec inside $NUPKG_PATH, found $nuspec_count. Refusing to guess which one describes the package being published."
            find "$extracted" -maxdepth 1 -name '*.nuspec' -exec basename {} \; || true
            exit 1
          fi
          nuspec=$(find "$extracted" -maxdepth 1 -name '*.nuspec')
          echo "Reading dependency set from $(basename "$nuspec")."

          echo "::group::All dependencies declared by $PACKAGE_ID"
          grep -oE '<dependency id="[^"]+" version="[^"]+"' "$nuspec" || echo "(none declared)"
          echo "::endgroup::"

          # id<TAB>version, one line per SharedKernel.* dependency.
          grep -oE '<dependency id="SharedKernel\.[^"]+" version="[^"]+"' "$nuspec" \
            | sed -E 's/<dependency id="([^"]+)" version="([^"]+)"/\1\t\2/' \
            > "$deps" || true

          if [ ! -s "$deps" ]; then
            echo "OK: $PACKAGE_ID declares no SharedKernel.* dependencies, so nothing it ships can point at an unpublished version."
            exit 0
          fi

          echo "$PACKAGE_ID declares these SharedKernel.* dependencies; each must already be on the feed:"
          sed -E 's/^/  /; s/\t/ @ >= /' "$deps"

          # $RUNNER_TEMP is OUTSIDE the repository tree, and that placement is load-bearing rather
          # than tidiness. NuGet.Config discovery walks UP from the project directory, and this
          # repo's own NuGet.Config maps every SharedKernel.* pattern to the local nupkgs/ folder.
          # Probing from inside the repo would let a locally packed copy satisfy a dependency that
          # does not exist on the real feed — a false GREEN, which is strictly worse than having no
          # gate at all, because it converts a caught problem into a silent one. The <clear /> plus
          # the explicit --configfile below are the second and third defenses against that; all
          # three have to fail together for a local artifact to be mistaken for a published one.
          cat > "$probe/NuGet.Config" <<'CONFIG'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="github" value="https://nuget.pkg.github.com/OWNER_PLACEHOLDER/index.json" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="github">
                <package pattern="SharedKernel.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          CONFIG
          sed -i "s|OWNER_PLACEHOLDER|$FEED_OWNER|" "$probe/NuGet.Config"

          # GitHub Packages requires authentication for every read, including of a public package.
          # Credentials are attached with `dotnet nuget update source` rather than written into the
          # heredoc above so the token is never a literal in this file or echoed by a shell trace.
          dotnet nuget update source github \
            --username "$FEED_OWNER" \
            --password "$NUGET_AUTH_TOKEN" \
            --store-password-in-clear-text \
            --configfile "$probe/NuGet.Config"

          {
            echo '<Project Sdk="Microsoft.NET.Sdk">'
            echo '  <PropertyGroup>'
            echo '    <TargetFramework>net10.0</TargetFramework>'
            # Central Package Management would demand a Directory.Packages.props that does not
            # exist out here, and these versions come from the .nuspec rather than from the repo.
            echo '    <ManagePackageVersionsCentrally>false</ManagePackageVersionsCentrally>'
            echo '  </PropertyGroup>'
            echo '  <ItemGroup>'
            while IFS="$(printf '\t')" read -r dep_id dep_version; do
              [ -n "$dep_id" ] || continue
              echo "    <PackageReference Include=\"$dep_id\" Version=\"$dep_version\" />"
            done < "$deps"
            echo '  </ItemGroup>'
            echo '</Project>'
          } > "$probe/DependencyExistenceProbe.csproj"

          echo "::group::probe project"
          cat "$probe/DependencyExistenceProbe.csproj"
          echo "::endgroup::"

          # --packages is the THIRD isolation defense and the one that is easiest to leave out and
          # hardest to notice missing. NuGet satisfies a PackageReference from the global packages
          # folder (~/.nuget/packages) BEFORE it ever contacts a source, so without a private,
          # empty packages directory this probe reports a pass whenever the dependency merely
          # happens to sit in the runner's cache — which proves nothing about whether it was ever
          # PUBLISHED. Measured, not theorised: with the global cache warm, a probe against a feed
          # that did not contain the dependency at all still exited 0. Any warm cache does it,
          # including a self-hosted or re-used runner, and the earlier restore/build/pack steps in
          # this very job are themselves cache-warming operations.
          if dotnet restore "$probe/DependencyExistenceProbe.csproj" \
               --configfile "$probe/NuGet.Config" \
               --packages "$probe/packages" > "$probe/restore.log" 2>&1; then
            echo "::group::restore log"
            cat "$probe/restore.log"
            echo "::endgroup::"
            echo "OK: every SharedKernel.* dependency $PACKAGE_ID declares resolves from the feed."
            exit 0
          fi

          echo "::error::$PACKAGE_ID declares one or more SharedKernel.* dependencies that do NOT resolve from GitHub Packages, so publishing this package on its own would ship a dependency on a version no consumer can restore. Release it with the rest of the set instead (a v* tag, release.yml). Reading the diagnostic printed below, each code measured by running this probe against a feed in that state: NU1101 means the dependency id is absent from the feed entirely — it has never been published. NU1102/NU1103 mean the id IS on the feed but no published version satisfies the declared minimum; that is the MinVer-height mismatch this gate exists for, where the dependency was published at an earlier commit height than the height this build stamped into the .nuspec. NU1100 means resolution was blocked rather than unsatisfied — typically the feed was unreachable or the credentials failed — which is an infrastructure problem, NOT evidence that the dependency is unpublished."
          # NuGet emits one diagnostic per unresolvable package, so these lines name every missing
          # dependency rather than only the first. NU1100 is matched alongside the others because
          # it is what appears when the feed itself cannot be consulted; it is a different
          # condition from the other three and the error text above says so rather than lumping
          # them together.
          if ! grep -E 'NU110[0123]' "$probe/restore.log"; then
            echo "No NU1100/NU1101/NU1102/NU1103 diagnostic found — the restore failed for some other reason, so do not read this as a missing dependency. Full log:"
            cat "$probe/restore.log"
          fi
          exit 1

      # Proves the packed artifact is genuinely consumable — not just that `dotnet pack` exited 0.
      # One step per package that has its own consumer-verify harness, each gated on PACKAGE_ID so
      # dispatching this workflow for a project with no harness still runs correctly rather than
      # failing on a check that does not apply to it.
      - name: Verify packed artifact is consumable (SharedKernel.Analyzers)
        if: env.PACKAGE_ID == 'SharedKernel.Analyzers'
        run: |
          set -e
          proj="00.Governance/_verification/AnalyzerConsumer/AnalyzerConsumer.csproj"
          dotnet restore "$proj" --force -p:SharedKernelPackageVersion="$PACKED_VERSION"
          echo "::group::build $proj"
          dotnet build "$proj" --no-restore --configuration Release -p:SharedKernelPackageVersion="$PACKED_VERSION" 2>&1 | tee analyzer-consumer-build.log
          echo "::endgroup::"
          # Same locale-proofing as ci.yml's packaging-verify job: grep the bare diagnostic ID,
          # never the localized word "warning" (see that job's step comment for why).
          if ! grep -q 'SK0001' analyzer-consumer-build.log; then
            echo "::error::SK0001 did not fire while building AnalyzerConsumer against the freshly packed SharedKernel.Analyzers ($PACKED_VERSION). Refusing to treat this as a passing verification — see ci.yml's packaging-verify job for the full explanation of what this check protects against."
            exit 1
          fi
          echo "OK: SK0001 present in AnalyzerConsumer's build output."
          dotnet run --project "$proj" --no-build --configuration Release

      # ArchTestConsumer resolves the package from the packed feed rather than by ProjectReference,
      # so it is the only place a missing package dependency actually surfaces. It EXECUTES each
      # rule (GetResult()) instead of merely compiling against it, and returns a non-zero exit code
      # if any rule cannot run — the defect it exists to catch was a runtime FileNotFoundException
      # on an assembly the nuspec never declared, which no compile-only check can see.
      - name: Verify packed artifact is consumable (SharedKernel.ArchitectureTests)
        if: env.PACKAGE_ID == 'SharedKernel.ArchitectureTests'
        run: |
          set -e
          proj="00.Governance/_verification/ArchTestConsumer/ArchTestConsumer.csproj"
          dotnet restore "$proj" --force -p:SharedKernelPackageVersion="$PACKED_VERSION"
          dotnet run --project "$proj" --no-restore --configuration Release -p:SharedKernelPackageVersion="$PACKED_VERSION"
          echo "OK: every probed rule executed from the packed $PACKAGE_ID $PACKED_VERSION."

      # Everything SharedKernel.Linter delivers is build-time (MSBuild props/targets plus two
      # config files), so LinterConsumer asserts the wiring in MSBuild rather than at runtime:
      # that the props and targets were imported from the package root at all, that CSharpier is
      # pinned to report-only so it can never rewrite a consumer's sources, and that the config
      # install target produces both files. Those assertions fail the build, so `dotnet run` here
      # is a genuine gate.
      - name: Verify packed artifact is consumable (SharedKernel.Linter)
        if: env.PACKAGE_ID == 'SharedKernel.Linter'
        run: |
          set -e
          proj="00.Governance/_verification/LinterConsumer/LinterConsumer.csproj"
          dotnet restore "$proj" --force -p:SharedKernelPackageVersion="$PACKED_VERSION"
          dotnet run --project "$proj" --no-restore --configuration Release -p:SharedKernelPackageVersion="$PACKED_VERSION"
          echo "OK: packed $PACKAGE_ID $PACKED_VERSION imports its build logic and installs its config."

      - name: No package-specific consumer-verify for this package
        if: env.PACKAGE_ID != 'SharedKernel.Analyzers' && env.PACKAGE_ID != 'SharedKernel.ArchitectureTests' && env.PACKAGE_ID != 'SharedKernel.Linter'
        run: echo "Packed package is '$PACKAGE_ID' — no package-specific consumability harness exists for it yet. Skipping. Its nested test suite and the dependency assertion above still ran."

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Dry run: ${PACKAGE_ID:-<not reached>}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Project | \`$INPUT_PROJECT\` |"
            echo "| Package ID | \`${PACKAGE_ID:-<not reached>}\` |"
            echo "| Version | \`${PACKED_VERSION:-<not reached>}\` |"
            echo "| Published | no (dry run only; releases go through release.yml) |"
          } >> "$GITHUB_STEP_SUMMARY"
