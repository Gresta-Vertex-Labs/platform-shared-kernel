name: CI

# Standing design decisions (see eng/README.md "CI workflows"):
#   - The gates themselves live in the reusable .github/workflows/verify.yml, which release.yml
#     also calls, so a pull request and a release tag are held to the same checks by construction.
#     This file decides WHEN they run and what blocks a merge.
#   - ci-gate is the ONLY required status check. Individual jobs are never marked required
#     directly: a job skipped by a condition would leave a required check waiting forever, and
#     renaming/adding/removing a job here never needs a ruleset edit.
#   - concurrency cancels superseded PR runs only. Never cancel-in-progress for merge_group or
#     push: a cancelled merge_group run drops the PR from the queue.
#   - Every third-party action is pinned to a full 40-character commit SHA with a trailing
#     `# vX.Y.Z` comment. Re-resolve and re-pin on every bump; never float a tag.
#   - Two lanes (DV-010/DV-011). The required lane (verify: tier check, solution-filter check,
#     full build, Unit suite, every consumer-verify harness, packaging-verify with every sample)
#     runs on every PR and push. The Testcontainers-backed Integration suite runs on push to main,
#     nightly and on demand only, and is deliberately NOT in ci-gate's needs: running up to 24
#     container suites at once on a 2-core runner failed a different suite on every run (resource
#     contention, not defects), and that must never block a merge. A red Integration run is kept
#     visible by integration-tracking-issue instead. release.yml runs both lanes and requires both.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
  merge_group:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
  # Integration lane only (see the integration job's `if:`); never on pull_request.
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily, off the top of the hour.
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------------------------
  # Required lane: tier-check, unit-test (build + Unit suite + in-solution consumer-verify
  # harnesses) and packaging-verify (pack, package-set check, every packed-package consumer and
  # sample). See verify.yml for each job.
  # ---------------------------------------------------------------------------------------------
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
    with:
      unit: true
      packaging: true
      integration: false

  # ---------------------------------------------------------------------------------------------
  # Non-required lane: the Testcontainers-backed Integration suite. Not triggered by
  # pull_request/merge_group and not in ci-gate's needs (see the header).
  # ---------------------------------------------------------------------------------------------
  integration:
    name: Integration
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
    with:
      unit: false
      packaging: false
      integration: true

  # ---------------------------------------------------------------------------------------------
  # Makes a red Integration run VISIBLE without making it a required check. The lane was once red
  # for six days with nobody noticing (2026-09-12..17), because nothing else looks at its result.
  # Keeps exactly one tracking issue open while the lane is red and closes it once it is green.
  #
  # Least privilege: `issues: write` on this job only, and no `contents` permission, because it
  # never checks out the repo. Uses the preinstalled gh CLI, so there is no action to pin.
  # ---------------------------------------------------------------------------------------------
  integration-tracking-issue:
    name: Track Integration Test Health
    needs: [integration]
    if: |
      always() &&
      (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No checkout, so gh cannot infer the repository from .git; name it explicitly.
      GH_REPO: ${{ github.repository }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TRACKING_TITLE: 'CI: Integration Test (Testcontainers) lane is failing'
    steps:
      # Matched on the exact title rather than a label: creating a label needs a permission this
      # job does not otherwise need, and the title is a stable, specific search key.
      - name: Find existing open tracking issue
        run: |
          set -e
          # Piped to the runner's jq rather than gh's --jq, which rejects jq's --arg flag.
          # $t is a jq --arg variable, not a bash expansion.
          # shellcheck disable=SC2016
          number=$(gh issue list --state open --search "in:title \"$TRACKING_TITLE\"" --json number,title \
            | jq -r --arg t "$TRACKING_TITLE" '[.[] | select(.title == $t)] | .[0].number // empty')
          echo "EXISTING_ISSUE=$number" >> "$GITHUB_ENV"
          if [ -n "$number" ]; then
            echo "Found existing open tracking issue #$number."
          else
            echo "No existing open tracking issue found."
          fi

      - name: Open or update the tracking issue (lane is red)
        if: env.INTEGRATION_RESULT == 'failure'
        run: |
          set -e
          line1="integration-test failed on $(date -u '+%Y-%m-%dT%H:%M:%SZ') (trigger: ${{ github.event_name }}, ref: ${{ github.ref_name }}). Run: $RUN_URL"
          line2="This is the non-required Testcontainers lane (Redis, PostgreSQL, RabbitMQ, MinIO, Meilisearch, Elasticsearch, Qdrant, etc). It never blocks a merge, but a red run here means an integration suite is genuinely broken and no PR feedback will ever surface it. It also blocks the next release tag, which runs this lane as a required gate. Check the run's integration-test-results artifact (trx files plus console log) to see which project(s) failed."
          body=$(printf '%s\n\n%s' "$line1" "$line2")
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --body "$body"
            echo "Commented on existing issue #$EXISTING_ISSUE."
          else
            gh issue create --title "$TRACKING_TITLE" --body "$body"
            echo "Opened a new tracking issue."
          fi

      - name: Close the tracking issue (lane is green again)
        if: env.INTEGRATION_RESULT == 'success' && env.EXISTING_ISSUE != ''
        run: |
          set -e
          gh issue comment "$EXISTING_ISSUE" --body "integration-test passed on $(date -u '+%Y-%m-%dT%H:%M:%SZ'). Run: $RUN_URL"
          gh issue close "$EXISTING_ISSUE"
          echo "Closed issue #$EXISTING_ISSUE."

  # ---------------------------------------------------------------------------------------------
  actionlint:
    name: Lint workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repository policy requires every action to be pinned to a full-length commit SHA, which
      # a docker:// action cannot satisfy (a digest is not a commit SHA), so the released binary is
      # downloaded and verified against the checksum published in the actionlint v1.7.7 release.
      # Re-resolve the version and checksum together on every bump.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # ---------------------------------------------------------------------------------------------
  # PR title is the ONLY string release automation will ever parse (squash merges collapse every
  # commit into the PR title). Commit-message lint is deliberately NOT enforced anywhere in this
  # workflow — it would fight the agent workflow's many small WIP commits and is moot once
  # squashed. See CONTRIBUTING.md "Commits and pull requests".
  # ---------------------------------------------------------------------------------------------
  pr-title:
    name: PR title lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Lint PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  # ---------------------------------------------------------------------------------------------
  # The only required status check. Runs unconditionally (if: always()) so it produces a result
  # even when an upstream job is skipped, cancelled or failed. `integration` is deliberately NOT
  # listed here (see the header).
  # ---------------------------------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    if: always()
    needs: [verify, actionlint, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check upstream job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e '
            to_entries | map(.value.result) |
            all(. == "success" or . == "skipped")
          ' || {
            echo "One or more required jobs failed or were cancelled."
            echo "$NEEDS"
            exit 1
          }
