name: CI

# Standing design decisions (see PLATFORM.md "CI/CD Pipelines" for the full rationale):
#   - ubuntu-latest only, forced by Testcontainers (Redis/PostgreSQL/RabbitMQ/MinIO/etc. need a
#     Linux Docker daemon; GitHub-hosted Windows/macOS runners cannot run Linux containers).
#   - ci-gate is the ONLY required status check. Individual jobs are never marked required
#     directly — if a future path-filtered job were added and marked required, a PR that never
#     triggers it would block forever. Renaming/adding/removing a job here never requires a
#     ruleset edit.
#   - concurrency cancels superseded PR runs only. Never cancel-in-progress for merge_group or
#     push — a cancelled merge_group run drops the PR from the queue; a cancelled release-adjacent
#     run can leave a partial package set.
#   - Every third-party action is pinned to a full 40-character commit SHA with a trailing
#     `# vX.Y.Z` comment. Re-resolve and re-pin on every bump; never float a tag.
#
#   - unit-test / integration-test split (DV-010/DV-011): a single "run every test against the
#     whole solution" job used to be the only required check, and it ran all 18 Testcontainers-
#     backed test projects (Redis x5, PostgreSQL, Dapper, RabbitMQ, MinIO x2, Meilisearch,
#     Elasticsearch, Qdrant, SignalR's Redis backplane, 18.Idempotency x2, 19.Scheduling,
#     16.Testing's own container-fixture self-tests) inline with everything else. On a 2-core
#     runner that starts as many as 18 containers at once, that job failed a DIFFERENT set of
#     container tests on every run — confirmed by three consecutive full-suite runs on hardware
#     far beefier than ubuntu-latest, where every "failing" suite passed cleanly in isolation.
#     That is resource contention, not a real defect, and it means the required check was
#     nondeterministically red on pushes that touched nothing related to the failure.
#     Fix: dotnet build still covers the WHOLE solution (compile correctness for every project,
#     containers or not, costs nothing extra — Testcontainers packages are ordinary .NET client
#     libraries at compile time). Only *test execution* is split via two solution filters
#     (Platform.SharedKernel.Unit.slnf / Platform.SharedKernel.Integration.slnf, both proven
#     against Platform.SharedKernel.slnx — see PLATFORM.md "Test topology"): unit-test runs the
#     133 container-free projects and is the required, on-every-push lane; integration-test runs
#     the 18 Testcontainers-backed projects (with VSTest parallelism capped to the runner's real
#     core count via eng/testsettings/integration.runsettings) on push-to-main/schedule/manual
#     dispatch only, and is deliberately NOT in ci-gate's needs so its container flakiness can
#     never block a merge.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
  merge_group:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
  # Integration lane only (see integration-test's own `if:` below) — never runs on pull_request,
  # so a contributor's PR feedback loop never pays the container-fan-out cost or its flakiness.
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily — off the top-of-hour to avoid the scheduler thundering herd.
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_UI_LANGUAGE: en
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ---------------------------------------------------------------------------------------------
  # Required, fast lane. Builds the WHOLE solution (full compile correctness — no project, tested
  # or not, is exempt from build errors) but only RUNS the 133 test projects with no Testcontainers
  # dependency, via Platform.SharedKernel.Unit.slnf. No Docker daemon is needed for this job to
  # pass; it never boots a container.
  # ---------------------------------------------------------------------------------------------
  unit-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # MANDATORY for MinVer (see Directory.Build.props "Versioning"). checkout's default
          # shallow clone fetches no tags, and MinVer does not fail when it finds none — it
          # silently stamps the MinVerMinimumMajorMinor floor as a prerelease. Without this,
          # a fully green run would produce correctly-named, wrongly-versioned packages.
          fetch-depth: 0

      # The stock ubuntu-latest image leaves too little free disk to build 176 projects in
      # Release: run #1 and #2 both died with 'No space left on device' mid-build. Reclaim the
      # preinstalled toolchains this repo never uses (~25GB). Runs before Setup .NET so the
      # SDK install is not the thing that tips it over.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          df -h /

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          # CPM concentrates every version into Directory.Packages.props, so hashing that one
          # file (plus global.json for the SDK band) is a near-perfect restore cache key —
          # deliberately NOT setup-dotnet's own cache:true, which requires lock files (this repo
          # has none, and generating 151 lock files to churn on every bump is a worse trade than
          # a slightly coarser cache key).
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Platform.SharedKernel.slnx

      - name: NuGet audit (escalated to error in CI only)
        # Directory.Build.props demotes NU1901-NU1904 to non-fatal warnings locally so a
        # newly-disclosed transitive CVE cannot break every developer's build with no code
        # change. CI is where that signal is deliberately restored to a hard failure.
        run: dotnet restore Platform.SharedKernel.slnx -warnaserror:NU1901,NU1902,NU1903,NU1904

      # Lockstep is only real while MinVer is the sole version authority. MinVer's target
      # overwrites $(Version) unconditionally, so a hand-written <Version> in a csproj is dead
      # XML that silently disagrees with the packed artifact — fail on it here rather than let
      # it mislead a reader.
      - name: Assert no project declares its own version
        run: |
          set -e
          if git grep -n -E '<(Version|VersionPrefix)>' -- '*.csproj'; then
            echo "::error::A csproj declares <Version>/<VersionPrefix>. Versions come from MinVer and git tags only (see Directory.Build.props 'Versioning'). Delete the element."
            exit 1
          fi
          echo "OK: no csproj declares its own version."

      # Full-solution build: compile correctness is never skipped for the 18 Testcontainers-backed
      # test projects just because their tests run in a separate job — only test EXECUTION is split.
      - name: Build
        run: dotnet build Platform.SharedKernel.slnx --no-restore --configuration Release

      # Narrowed to the 158 container-free projects. See Platform.SharedKernel.Unit.slnf and the
      # top-of-file comment for why this split exists.
      - name: Unit test (no Docker dependency)
        # No fixed LogFileName: dotnet test spawns one VSTest host per project in the filter, and a
        # single hardcoded trx name would make every project's run silently overwrite the previous
        # one's file (confirmed locally — the fixed-name pattern this replaced only ever uploaded
        # the LAST project's results). Letting the logger auto-name each trx keeps all of them.
        run: dotnet test Platform.SharedKernel.Unit.slnf --no-build --configuration Release --logger "trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: TestResults/**/*.trx
          retention-days: 14

  # ---------------------------------------------------------------------------------------------
  # Non-required lane. Runs the 18 Testcontainers-backed test projects (Redis x5, PostgreSQL,
  # Dapper, RabbitMQ, MinIO x2 (S3+OBS), Meilisearch, Elasticsearch, Qdrant, SignalR's Redis
  # backplane, 18.Idempotency x2, 19.Scheduling, and 16.Testing's own container-fixture self-tests
  # — including the still-live SharedKernel.AI.Milvus retraction leftover, MilvusContainerFixture;
  # see PLATFORM.md hand-offs) via Platform.SharedKernel.Integration.slnf, with VSTest parallelism
  # capped by eng/testsettings/integration.runsettings to the runner's real core count.
  #
  # Deliberately NOT in ci-gate's `needs` and deliberately NOT triggered by pull_request/
  # merge_group (the `if:` below): the whole point of this split is that container-fan-out
  # flakiness must never block a merge. It still runs — and still reports real pass/fail — on
  # every push to main, on the nightly schedule, and on demand, so regressions are caught
  # promptly without gating anyone's PR.
  # ---------------------------------------------------------------------------------------------
  integration-test:
    name: Integration Test (Testcontainers)
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Testcontainers pulls several multi-hundred-MB images (Postgres, Redis, RabbitMQ, MinIO,
      # Meilisearch, Elasticsearch, Qdrant, Milvus) on top of the build output — free the same
      # unused preinstalled toolchains as unit-test.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          df -h /

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Restores only the 18-project closure (plus whatever they transitively reference) —
      # this job does not need the audit-escalation or version-assert steps, which already run
      # in the required unit-test job against the full solution.
      - name: Restore
        run: dotnet restore Platform.SharedKernel.Integration.slnf

      - name: Build
        run: dotnet build Platform.SharedKernel.Integration.slnf --no-restore --configuration Release

      - name: Integration test (Testcontainers, capped parallelism)
        # See unit-test's identical comment: no fixed LogFileName, or every project after the
        # first silently overwrites the previous one's trx.
        run: dotnet test Platform.SharedKernel.Integration.slnf --no-build --configuration Release -s eng/testsettings/integration.runsettings --logger "trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results
          path: TestResults/**/*.trx
          retention-days: 14

  # ---------------------------------------------------------------------------------------------
  # Proves the packed .nupkg artifacts actually resolve and function for a consumer — not just
  # that the source compiles. Packs every real shipping package to a job-local feed, then builds
  # AND RUNS the six consumer-verify/*Consumer harnesses that reference those packages via
  # PackageReference (never ProjectReference) against that feed. These six are deliberately
  # excluded from Platform.SharedKernel.slnx (see PLATFORM.md) so a normal `dotnet build` never
  # touches them — this job is their only execution path. Kept in the required path deliberately:
  # it takes exactly one Testcontainers-Redis dependency (an isolated single-container proof, not
  # the many-containers-at-once fan-out that caused DV-010's flakiness), and it is the one
  # mechanism proving packages are actually consumable before a tag can be published.
  # ---------------------------------------------------------------------------------------------
  packaging-verify:
    name: Packaging & Consumer-Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # MANDATORY for MinVer (see Directory.Build.props "Versioning"). checkout's default
          # shallow clone fetches no tags, and MinVer does not fail when it finds none — it
          # silently stamps the MinVerMinimumMajorMinor floor as a prerelease. Without this,
          # a fully green run would produce correctly-named, wrongly-versioned packages.
          fetch-depth: 0

      # The stock ubuntu-latest image leaves too little free disk to build 176 projects in
      # Release: run #1 and #2 both died with 'No space left on device' mid-build. Reclaim the
      # preinstalled toolchains this repo never uses (~25GB). Runs before Setup .NET so the
      # SDK install is not the thing that tips it over.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          df -h /

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Platform.SharedKernel.slnx

      # Every real shipping package (IsPackable=true, non-Exe, non-.Tests) is packed here. A
      # project missing README.md/Description/PackageTags fails loudly via the SKPKG001-003
      # guards in Directory.Build.targets rather than silently skipping — see PLATFORM.md's
      # "known gaps" note for the packages currently failing this gate.
      - name: Pack every shipping package
        run: dotnet pack Platform.SharedKernel.slnx --no-restore --configuration Release

      # The mechanical lock on repo-wide lockstep, asserted against the produced artifacts rather
      # than against any property MSBuild reported: every .nupkg in the feed must carry one
      # identical version. Also exports that version so the harness steps below consume the bits
      # this run just built, instead of whatever happens to be newest in ./nupkgs.
      - name: Verify version lockstep across packed packages
        run: |
          set -e
          # Version is read off the produced artifacts, not off any property MSBuild reported.
          # Anchored at end-of-name so a package ID that itself ends in a digit
          # (SharedKernel.Storage.S3) cannot have part of its name misread as the version.
          versions=$(for f in nupkgs/*.nupkg; do
            basename "$f" .nupkg | grep -oE '[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$'
          done | sort -u)
          packed=$(find nupkgs -name "*.nupkg" | wc -l)
          count=$(echo "$versions" | wc -l)
          echo "Packed $packed package(s) carrying $count distinct version(s):"
          echo "$versions" | awk '{ print "  " $0 }'
          if [ "$count" -ne 1 ]; then
            echo "::error::Version lockstep broken - packed packages carry $count distinct versions."
            exit 1
          fi
          case "$versions" in
            0.0.0*)
              echo "::error::MinVer stamped 0.0.0 - checkout has no tag history (fetch-depth: 0 missing)."
              exit 1
              ;;
          esac
          echo "SK_VERSION=$versions" >> "$GITHUB_ENV"
          echo "All $packed packages share one version: $versions"

      - name: Restore consumer-verify harnesses against the freshly packed feed
        run: |
          set -e
          for proj in \
            "00.Governance/_verification/AnalyzerConsumer/AnalyzerConsumer.csproj" \
            "00.Governance/_verification/ArchTestConsumer/ArchTestConsumer.csproj" \
            "00.Governance/_verification/LinterConsumer/LinterConsumer.csproj" \
            "01.Core/SharedKernel.Consumer.Tests/SharedKernel.Consumer.Tests.csproj" \
            "02.Caching/consumer-verify/SharedKernel.Caching.ConsumerVerify/SharedKernel.Caching.ConsumerVerify.csproj" \
            "03.Domain/SharedKernel.Domain.ConsumerVerify/SharedKernel.Domain.ConsumerVerify.csproj" \
            "samples/OrderApi/OrderApi.csproj" \
            ; do
            echo "::group::restore $proj"
            dotnet restore "$proj" --force -p:SharedKernelPackageVersion="$SK_VERSION"
            echo "::endgroup::"
          done

      # AnalyzerConsumer is pulled out of the loop below into its own step, because it is the one
      # harness whose entire reason to exist is proving a compiler DIAGNOSTIC actually fires, not
      # just that the packed package restores/builds/runs. SK0001 is Warning severity,
      # AnalyzerConsumer.csproj sets no TreatWarningsAsErrors, and nothing previously inspected the
      # build output for the diagnostic ID — so a broken analyzer (wrong analyzers/dotnet/cs
      # PackagePath, a broken netstandard2.0 target, an assembly-load failure) could silently stop
      # emitting and this job would stay green while publishing a package that enforces nothing.
      #
      # Locale-proofing: grep the bare diagnostic ID "SK0001", never the word "warning" — MSBuild's
      # per-diagnostic canonical line keeps "warning"/"error" in English regardless of CLI locale,
      # but that is an implementation detail of the current toolchain, not a contract, and this
      # repo has been built on a non-English-locale machine (confirmed: dotnet's own top-level
      # status text renders in Turkish there) where other surrounding output ("X Uyarı"/"X Hata"
      # instead of "X Warning(s)"/"X Error(s)") already is localized. The diagnostic ID itself is
      # never localized under any observed toolchain behavior, so it's the only safe anchor.
      # DOTNET_CLI_UI_LANGUAGE=en (workflow-level env, top of this file) is kept as defense in
      # depth so the raw log stays human-readable in the Actions UI regardless of runner locale,
      # but the assertion below does not depend on it.
      - name: Build AnalyzerConsumer and assert SK0001 fired
        run: |
          set -e
          proj="00.Governance/_verification/AnalyzerConsumer/AnalyzerConsumer.csproj"
          echo "::group::build $proj"
          dotnet build "$proj" --no-restore --configuration Release -p:SharedKernelPackageVersion="$SK_VERSION" 2>&1 | tee analyzer-consumer-build.log
          echo "::endgroup::"
          if ! grep -q 'SK0001' analyzer-consumer-build.log; then
            echo "::error::SK0001 did not fire while building AnalyzerConsumer against the freshly packed SharedKernel.Analyzers ($SK_VERSION). Program.cs's 'DateTime.UtcNow' usage is expected to trigger it. Its absence means the packed analyzer enforces nothing — check the analyzers/dotnet/cs PackagePath, the netstandard2.0 target, and whether the analyzer assembly loaded at all. Refusing to treat this as a passing verification."
            exit 1
          fi
          echo "OK: SK0001 present in AnalyzerConsumer's build output."

      - name: Run AnalyzerConsumer
        run: dotnet run --project "00.Governance/_verification/AnalyzerConsumer/AnalyzerConsumer.csproj" --no-build --configuration Release

      - name: Build and run remaining consumer-verify harnesses
        run: |
          set -e
          for proj in \
            "00.Governance/_verification/ArchTestConsumer/ArchTestConsumer.csproj" \
            "00.Governance/_verification/LinterConsumer/LinterConsumer.csproj" \
            "03.Domain/SharedKernel.Domain.ConsumerVerify/SharedKernel.Domain.ConsumerVerify.csproj" \
            ; do
            echo "::group::run $proj"
            dotnet run --project "$proj" --no-restore --configuration Release -p:SharedKernelPackageVersion="$SK_VERSION"
            echo "::endgroup::"
          done

      # samples/ are runnable services, not harnesses — build and exercise them against the
      # packed feed so a sample that breaks against a real published package fails CI here.
      - name: Build samples against packed packages
        run: dotnet build "samples/OrderApi/OrderApi.csproj" --no-restore --configuration Release -p:SharedKernelPackageVersion="$SK_VERSION"

      - name: Smoke-test OrderApi sample
        env:
          ASPNETCORE_URLS: http://localhost:5199
        run: |
          set -e
          dotnet run --project "samples/OrderApi/OrderApi.csproj" --no-build --no-restore --configuration Release -p:SharedKernelPackageVersion="$SK_VERSION" &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -sf http://localhost:5199/health/ready >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:5199/health/live  | grep -q Healthy
          curl -sf http://localhost:5199/health/ready | grep -q Healthy
          id=$(curl -sf -X POST http://localhost:5199/orders -H 'Content-Type: application/json' -d '{"customer":"CI","amount":10.00,"currency":"eur","lines":["item"]}' | sed 's/.*"id":"//;s/".*//')
          test -n "$id"
          curl -sf "http://localhost:5199/orders/$id" | grep -q '"currency":"EUR"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5199/orders/01999999-0000-7000-8000-000000000000)" = 404
          echo "OrderApi sample smoke test passed"

      # SharedKernel.Caching.ConsumerVerify is a Testcontainers-backed 5-surface harness
      # (real Redis) — run separately so its longer runtime and log volume don't crowd the
      # group above.
      - name: Run Caching consumer-verify (Testcontainers Redis)
        run: dotnet run --project "02.Caching/consumer-verify/SharedKernel.Caching.ConsumerVerify/SharedKernel.Caching.ConsumerVerify.csproj" --no-restore --configuration Release -p:SharedKernelPackageVersion="$SK_VERSION"

      # SharedKernel.Consumer.Tests is an xUnit project (not an Exe harness) — run via `dotnet test`.
      - name: Run 01.Core consumer test suite
        run: dotnet test "01.Core/SharedKernel.Consumer.Tests/SharedKernel.Consumer.Tests.csproj" --no-restore --configuration Release -p:SharedKernelPackageVersion="$SK_VERSION"

  # ---------------------------------------------------------------------------------------------
  actionlint:
    name: Lint workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        with:
          args: -color

  # ---------------------------------------------------------------------------------------------
  # PR title is the ONLY string release automation will ever parse (squash merges collapse every
  # commit into the PR title). Commit-message lint is deliberately NOT enforced anywhere in this
  # workflow — it would fight the agent workflow's many small WIP commits and is moot once
  # squashed. See PLATFORM.md "Commit-convention enforcement".
  # ---------------------------------------------------------------------------------------------
  pr-title:
    name: PR title lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Lint PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  # ---------------------------------------------------------------------------------------------
  # The only required status check. Runs unconditionally (if: always()) so it produces a result
  # even when an upstream job is skipped by a path filter, cancelled, or fails outright — a
  # path-filtered job that is itself marked required in the branch/tag ruleset would leave a
  # docs-only PR waiting forever for a check that never ran. integration-test is deliberately NOT
  # listed here — see its own job comment for why.
  # ---------------------------------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    if: always()
    needs: [unit-test, packaging-verify, actionlint, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check upstream job results
        run: |
          echo '${{ toJSON(needs) }}' | jq -e '
            to_entries | map(.value.result) |
            all(. == "success" or . == "skipped")
          ' || {
            echo "One or more required jobs failed or were cancelled."
            echo '${{ toJSON(needs) }}'
            exit 1
          }
