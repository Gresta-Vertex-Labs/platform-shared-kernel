name: PR Labeler

# Labels pull requests by the paths they change (area: 00-governance … area: 20-reporting,
# area: build-ci, type: docs, dependencies), using the rules in .github/labeler.yml.
#
# pull_request_target so PRs from forks can be labelled. Safe: actions/labeler reads the changed
# file list and its configuration through the API and never checks out or runs PR code.
# Labels are only added (sync-labels: false), so a maintainer's manual labels are never removed.

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label by changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply path labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
