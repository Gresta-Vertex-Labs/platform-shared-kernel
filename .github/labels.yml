# Source of truth for every label in this repository, applied by .github/workflows/label-sync.yml.
#
# Labels NOT listed here are DELETED from the repository by the sync (removing them from issues and
# PRs too). Add a label here before using it in a template or workflow. To rename a label without
# losing it from existing issues, keep the old name in `from_name`.
#
# Groups: type · area · status · priority · resolution · automation · community

# --- type: what kind of work ----------------------------------------------------------------------
- name: "type: bug"
  from_name: "bug"
  color: "d73a4a"
  description: "Something does not work as documented"
- name: "type: feature"
  from_name: "enhancement"
  color: "a2eeef"
  description: "New capability or improvement to an existing one"
- name: "type: rfc"
  color: "5319e7"
  description: "Architecture proposal that needs a design decision"
- name: "type: docs"
  from_name: "documentation"
  color: "0075ca"
  description: "Documentation, XML docs or samples"
- name: "type: performance"
  color: "fbca04"
  description: "Speed, allocations or memory"
- name: "type: maintenance"
  color: "c5def5"
  description: "Refactoring, cleanup, tooling or build upkeep"
- name: "dependencies"
  color: "0366d6"
  description: "Updates a NuGet package or GitHub Action"

# --- area: which domain (applied automatically from issue forms and changed paths) -----------------
- name: "area: 00-governance"
  color: "e4e669"
  description: "Analyzers, architecture tests, linting, benchmarks"
- name: "area: 01-core"
  color: "c2e0c6"
