- name: "area: 02-caching"
  color: "c2e0c6"
  description: "FusionCache and Redis"
- name: "area: 03-domain"
  color: "c2e0c6"
  description: "DDD building blocks and Money"
- name: "area: 04-contracts"
  color: "c2e0c6"
  description: "Integration events, envelopes and paging contracts"
- name: "area: 05-application"
  color: "bfdadc"
  description: "Request contracts, pipeline behaviors and the mediator adapter"
- name: "area: 06-persistence"
  color: "bfdadc"
  description: "EF Core, PostgreSQL and Dapper"
- name: "area: 07-messaging"
  color: "bfdadc"
  description: "MassTransit messaging"
- name: "area: 08-storage"
  color: "bfdadc"
  description: "Object storage: S3, MinIO, Huawei OBS"
- name: "area: 09-search"
  color: "bfdadc"
  description: "Meilisearch and Elasticsearch"
- name: "area: 10-intelligence"
  color: "bfdadc"
  description: "Embeddings, Qdrant and Semantic Kernel"
- name: "area: 11-communication"
  color: "bfdadc"
  description: "REST and gRPC clients, service discovery"
- name: "area: 12-security"
  color: "bfdadc"
  description: "OIDC, API keys, mTLS, DPoP and TOTP"
- name: "area: 13-servicedefaults"
  color: "d4c5f9"
  description: "OpenTelemetry, health checks and multi-tenancy"
- name: "area: 14-presentation"
  color: "d4c5f9"
  description: "Web API, gRPC server, SignalR and GraphQL"
- name: "area: 15-integration"
  color: "d4c5f9"
  description: "Webhooks and notifications"
- name: "area: 16-testing"
  color: "fef2c0"
  description: "Per-capability test packages and Testcontainers fixtures"
- name: "area: 17-workflows"
  color: "f9d0c4"
  description: "Temporal workflows"
- name: "area: 18-idempotency"
  color: "f9d0c4"
  description: "Idempotency contract and stores"
- name: "area: 19-scheduling"
  color: "f9d0c4"
  description: "Recurring and deferred jobs"
- name: "area: 20-reporting"
  color: "f9d0c4"
  description: "CSV, spreadsheet and PDF exports"
- name: "area: build-ci"
  color: "ededed"
  description: "Build, CI, packaging and repository tooling"
- name: "area: samples"
  color: "ededed"
  description: "Sample applications"

# --- status: where the work stands ----------------------------------------------------------------
- name: "status: needs triage"
  color: "fbca04"
  description: "Waiting for a maintainer to review"
- name: "status: needs info"
  color: "fef2c0"
  description: "Waiting for more information from the author"
- name: "status: accepted"
  color: "0e8a16"
  description: "Confirmed and ready to be worked on"
- name: "status: in progress"
  color: "1d76db"
  description: "Someone is working on this"
- name: "status: blocked"
  color: "b60205"
  description: "Cannot proceed until something else is resolved"

# --- priority -------------------------------------------------------------------------------------
- name: "priority: critical"
  color: "b60205"
  description: "Data loss, security or a broken release — drop everything"
- name: "priority: high"
  color: "d93f0b"
  description: "Important, next in line"
- name: "priority: medium"
  color: "fbca04"
  description: "Normal priority"
- name: "priority: low"
  color: "0e8a16"
  description: "Nice to have"

# --- resolution: why an issue was closed without a fix --------------------------------------------
- name: "resolution: duplicate"
  from_name: "duplicate"
  color: "cfd3d7"
  description: "Already reported elsewhere"
- name: "resolution: invalid"
  from_name: "invalid"
  color: "e4e669"
  description: "Not a problem with this project"
- name: "resolution: wontfix"
  from_name: "wontfix"
  color: "ffffff"
  description: "Will not be worked on"

# --- automation: applied by workflows -------------------------------------------------------------
- name: "breaking change"
  color: "b60205"
  description: "Breaks public API or behavior — needs migration notes"
- name: "security: sensitive"
  color: "e11d48"
  description: "Touches cryptography, authentication, authorization or tenant isolation"
- name: "regression"
  color: "d93f0b"
  description: "Worked in an earlier version"
- name: "template: incomplete"
  color: "fbca04"
  description: "PR description does not satisfy the template yet"
- name: "template: exempt"
  color: "c5def5"
  description: "Maintainer override: skip the PR template check"

# --- community (names are fixed: GitHub surfaces these on the Contribute page) ---------------------
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
