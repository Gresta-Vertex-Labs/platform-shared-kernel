# Path-based PR labels, applied by .github/workflows/pr-labeler.yml (actions/labeler).
# Every label used here must also exist in .github/labels.yml.

"area: 00-governance":
  - changed-files:
      - any-glob-to-any-file: "tools/Governance/**"
