"area: build-ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "eng/**"
          - "Directory.Build.props"
          - "Directory.Build.targets"
          - "Directory.Packages.props"
          - "global.json"
          - "NuGet.Config"
          - "*.slnx"
          - "*.slnf"
"area: samples":
  - changed-files:
      - any-glob-to-any-file: "samples/**"
"dependencies":
  - changed-files:
      - any-glob-to-any-file: "Directory.Packages.props"
"type: docs":
  - changed-files:
      - all-globs-to-all-files: "**/*.md"
