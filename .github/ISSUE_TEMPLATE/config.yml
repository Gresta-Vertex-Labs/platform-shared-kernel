    url: https://github.com/Gresta-Vertex-Labs/platform-shared-kernel/security/advisories/new
    about: Never open a public issue for a vulnerability. Report it privately — see SECURITY.md.
  - name: 🧭 Architecture and tier rules
    url: https://github.com/Gresta-Vertex-Labs/platform-shared-kernel/blob/main/CLAUDE.md
    about: The domain map, dependency rules and "What goes where" guide. Worth a look before proposing a feature.
