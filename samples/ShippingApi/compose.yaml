# RabbitMQ for running the sample by hand. The tests start their own container instead
# (Testcontainers), so nothing here is needed for `dotnet test`.
#
#   docker compose -f samples/ShippingApi/compose.yaml up -d
#   dotnet run --project samples/ShippingApi
#
# Management UI: http://localhost:15672 (guest / guest) — queues, message rates, dead letters.
#
# masstransit/rabbitmq rather than the official rabbitmq image, because WithDelayedDelivery()
# uses the broker's delayed-message exchange and that is a community plugin the official image
# does not ship. This one has it enabled out of the box. Without it the bus starts, and the
# first scheduled message fails when the x-delayed-message exchange cannot be declared.
services:
  rabbitmq:
    image: masstransit/rabbitmq:4.3.1
    container_name: shippingapi-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 20
